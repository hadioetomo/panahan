name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 4. Buat Konfigurasi Web Saja
        # Hanya membuat folder web jika belum lengkap tanpa merusak pubspec.yaml
        run: |
          flutter config --enable-web
          flutter create . --platforms=web

      - name: 5. Tambah Dependency HTTP & Install
        # Memastikan package http terpasang 100% di server build
        run: |
          flutter pub add http
          flutter pub get

      - name: 6. Build Flutter Web
        run: flutter build web --release --base-href "/panahan/"

      - name: 7. Deploy ke GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
